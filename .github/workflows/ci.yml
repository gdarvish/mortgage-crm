name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jsdom 30, which the component tests run under, requires
      # ^22.22.2 || ^24.15.0 || >=26 — its bundled undici crashes on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The emulator suite runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      # Unit, project and component tests, then the rules and service suites
      # under the Firebase emulator.
      - run: npm run test:all

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      # Pinned to 20 deliberately: that is the runtime Cloud Functions deploy
      # to, per functions/package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
